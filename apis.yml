apis:
- aid: university-of-leeds:library-discovery-primo
  name: Library Search (Ex Libris Alma / Primo) — tenancy
  x-operator: tenant
  x-operator-evidence: >-
    Discovery runs at leeds.primo.exlibrisgroup.com with view id 44LEE_INST — an institution- specific
    view on a vendor-operated platform, on the vendor's registrable domain. The 2026-06-03 profile carried
    a library.leeds.ac.uk humanURL on this entry, which made a vendor tenancy read as institution-owned
    to a host-based verdict. Corrected 2026-08-30.
  description: >-
    RELATIONSHIP, NOT A CONTRACT. University of Leeds Libraries discovery and resource management run
    on the Ex Libris Alma library services platform with the Primo discovery layer. The tenancy is a real
    institutional fact — the collection, the holdings and the patron data are Leeds'. The interface is
    not: Alma and Primo REST and SRU APIs are Ex Libris' engineering, documented on the Ex Libris Developer
    Network, and keys are issued by Ex Libris to the institution. No Ex Libris specification is stored
    in this repository and none should be; it belongs in the Ex Libris profile. Leeds publishes no public
    developer documentation for these endpoints.
  humanURL: https://leeds.primo.exlibrisgroup.com/discovery/search?vid=44LEE_INST:VU1
