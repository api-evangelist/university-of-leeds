---
aid: university-of-leeds
name: University of Leeds
description: >-
  The University of Leeds is a public research university in Leeds, United
  Kingdom, ranked #60 in the QS World University Rankings 2025. With more than
  34,000 students and over 7,000 staff, it is a member of the Russell Group of
  research-intensive universities. Its public developer/API footprint is
  modest and centered on the Libraries: a live EPrints-based Research Data Leeds
  Repository exposing an OAI-PMH 2.0 endpoint, IIIF-enabled Cultural Collections
  delivered via a Digirati-built digital library infrastructure, and an active
  GitHub organisation (uol-library). Library discovery runs on Ex Libris
  Alma/Primo, whose APIs are vendor-provided rather than institution-documented.
  No central, self-service developer portal was found.
type: Index
position: Consumer
