x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated, machine-readable surfaces were probed live and all four answered.
    This is a genuinely thin but genuinely real footprint, and the profile now says which parts are
    Leeds' and which are a vendor's. Corrections made in this pass: the Ex Libris Alma/Primo entry
    was carrying a library.leeds.ac.uk humanURL, which made a vendor tenancy read as an
    institution-owned surface to a host-based verdict — it is now x-operator tenant, anchored on
    leeds.primo.exlibrisgroup.com (vid=44LEE_INST). The 2026-06-03 "Cultural Collections IIIF" entry
    was withdrawn: its own description admitted no confirmed manifest base URL, and the EPrints
    IIIF manifest endpoint at digital.library.leeds.ac.uk/cgi/iiif/manifest/{id} is a soft-200 —
    HTTP 200 with a zero-byte body for identifiers 1, 2, 100, 500, 1000 and 1705. It was replaced
    with the library floor plans IIIF Image API, which was verified. The 2026-06-03 note claiming
    data.leeds.ac.uk is "a third-party data consultancy" was not supported: the host is under the
    university's own registrable domain, resolves to WP Engine, and is Cloudflare bot-challenged
    (HTTP 403 to curl and to a browser user-agent alike) — it is bot_blocked and unread, not
    third-party. arc.leeds.ac.uk (Advanced Research Computing) and generative-ai.leeds.ac.uk are
    behind the same challenge; both are confirmed live and are recorded as pointers. Two negative
    findings are recorded so they are not re-claimed from prose: no publicly retrievable
    Shibboleth/SAML metadata exists under any leeds.ac.uk host (idp.leeds.ac.uk redirects to a
    ServiceNow catalogue item), and ORCID is documented for researchers but is not emitted in any
    machine-readable surface. Nothing in this repository is attributed to Leeds that Leeds does not
    operate.
  evidence:
    - { url: 'https://spacefinder.leeds.ac.uk/spaces.json', status: 200 }
    - { url: 'https://archive.researchdata.leeds.ac.uk/cgi/oai2?verb=Identify', status: 200 }
