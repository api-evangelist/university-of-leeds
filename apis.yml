apis:
  - aid: university-of-leeds:research-data-oai
    name: Research Data Leeds Repository (OAI-PMH)
    description: >-
      The institutional research data repository for the University of Leeds,
      powered by EPrints 3. It exposes a live OAI-PMH 2.0 endpoint for harvesting
      Dublin Core and related metadata records describing deposited research
      datasets, plus Atom and RSS feeds. Verified live (HTTP 200) on
      2026-06-03 via verb=Identify and verb=ListMetadataFormats.
    humanURL: https://archive.researchdata.leeds.ac.uk/
    baseURL: https://archive.researchdata.leeds.ac.uk/cgi/oai2
    tags: [ Research Data, OAI-PMH, EPrints, Metadata, Repository ]
    properties:
      - type: Documentation
        url: https://archive.researchdata.leeds.ac.uk/
      - type: Authentication
        url: https://archive.researchdata.leeds.ac.uk/cgi/oai2?verb=Identify
  - aid: university-of-leeds:iiif-cultural-collections
    name: Cultural Collections IIIF
    description: >-
      The University of Leeds Libraries' Cultural Collections are IIIF-enabled
      through a digital library infrastructure built in partnership with
      Digirati (IIIF Image API at the access end, OCFL at the preservation end).
      Tens of thousands of digitised manuscripts, rare books, artworks and coins
      expose IIIF Manifest URLs from their catalogue records. No published
      developer reference or fixed manifest base URL was confirmed; manifests are
      discovered per-record from the Special Collections catalogue.
    humanURL: https://library.leeds.ac.uk/info/1500/special_collections
    tags: [ IIIF, Libraries, Digital Collections, Images, Cultural Heritage ]
    properties:
      - type: Documentation
        url: https://library.leeds.ac.uk/info/1500/special_collections
      - type: GitHub
        url: https://github.com/uol-library/eprints-iiif-manifest
  - aid: university-of-leeds:library-discovery
    name: Library Search (Ex Libris Alma / Primo)
    description: >-
      University of Leeds Libraries discovery and resource management run on the
      Ex Libris Alma library services platform with the Primo discovery layer
      (migrated from Innovative Sierra). Programmatic access is available only
      through the vendor's Alma/Primo REST and SRU APIs, which require
      institution-issued keys; Leeds publishes no public developer documentation
      for these endpoints.
    humanURL: https://library.leeds.ac.uk/
    tags: [ Libraries, Discovery, Alma, Primo, Ex Libris ]
    properties:
      - type: Documentation
        url: https://library.leeds.ac.uk/info/1100/search-resources
