---
aid: university-of-leeds
name: University of Leeds
x-type: university
x-category: Public Research University
description: >-
  The University of Leeds is a public research university in Leeds, United Kingdom, a member of the
  Russell Group, with more than 34,000 students and over 7,000 staff. Its programmable footprint is
  small, real, and almost entirely the work of one department: University of Leeds Libraries. Four
  surfaces were verified live on 2026-08-30 and every one of them runs on a leeds.ac.uk host under
  the institution's own operation — two self-hosted EPrints repositories exposing OAI-PMH 2.0
  (Research Data Leeds, and the Digital Library of digitised Special Collections), a IIIF Image API
  level 0 service behind the library floor plans, and Spacefinder, an unauthenticated JSON dataset of
  68 campus study spaces with geolocation, opening hours, facilities and accessibility. All four are
  anonymous, keyless and read-only. There is no central developer portal, no API gateway, no
  registration, no status page, no changelog and no published OpenAPI — the four OpenAPI documents in
  this repository were derived by API Evangelist from probed responses, not published by Leeds.
  Library discovery is an Ex Libris Alma/Primo tenancy and the university's publications repository is
  White Rose Research Online, a three-university consortium platform; both are recorded here as tenant
  relationships, not as Leeds contracts. Advanced Research Computing (ARC) operates the Aire HPC
  service for researchers, but its allocation and service surfaces are behind institutional login.
