    - { url: 'https://floorplans.library.leeds.ac.uk/assets/iiif/original/brotherton-m1/info.json', status: 200 }
    - { url: 'https://digital.library.leeds.ac.uk/cgi/iiif/manifest/1705', status: 200 }
    - { url: 'https://leeds.primo.exlibrisgroup.com/discovery/search?vid=44LEE_INST:VU1', status: 200 }
    - { url: 'https://eprints.whiterose.ac.uk/cgi/oai2?verb=Identify', status: 200 }
    - { url: 'https://data.leeds.ac.uk/', status: 403 }
