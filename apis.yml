- aid: university-of-leeds:white-rose-research-online
  name: White Rose Research Online (OAI-PMH) — consortium tenancy
  x-operator: tenant
  x-operator-evidence: >-
    eprints.whiterose.ac.uk is on whiterose.ac.uk, not leeds.ac.uk. OAI Identify returns repositoryName
    "White Rose Research Online" with adminEmail eprints@whiterose.ac.uk. The University of Leeds is one
    of three co-owning institutions (with Sheffield and York) of the White Rose University Consortium,
    not the operator of the host. audit-university-contracts.py returns a cohort-derived verdict of `vendor`
    on this host — "same host claimed by 2 other institution(s)" — and that computation is correct. It
    is recorded as `tenant` rather than `vendor` because White Rose is not a commercial platform with
    customers: Leeds co-owns the consortium and the deposits are Leeds'. The BEHAVIOUR is identical either
    way, and it is the behaviour that matters: no White Rose contract is saved under this slug and no
    credit is taken for its engineering.
  description: >-
    RELATIONSHIP, NOT A CONTRACT. Leeds' scholarly publications repository is White Rose Research Online,
    a shared EPrints platform operated by the White Rose University Consortium on behalf of Leeds, Sheffield
    and York. It exposes a live OAI-PMH 2.0 endpoint (verified 2026-08-30, earliest datestamp 2007-08-05).
    Leeds' outputs are in it and Leeds co-owns the consortium, but the host is not under a Leeds registrable
    domain and the deposits of two other universities share the same endpoint — so the interface is recorded
    as a tenancy and no White Rose specification is stored under this slug. This is the correct handling
    of a shared contract: the relationship is kept, the credit is not taken.
  humanURL: https://eprints.whiterose.ac.uk/
  baseURL: https://eprints.whiterose.ac.uk/cgi/oai2
