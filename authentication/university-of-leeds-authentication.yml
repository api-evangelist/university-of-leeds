summary: >-
  Every institution-operated surface the University of Leeds exposes is fully anonymous. There is no
  registration, no key issuance, no OAuth flow, no rate-limit header and no developer account. This
  is a genuine open-access posture, not an undocumented one — but it also means there is no
  onboarding path, no way to identify a caller, and no contact route for a consumer with a problem.
